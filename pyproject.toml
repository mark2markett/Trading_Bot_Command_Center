[project]
name = "command-center"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2", "python-dotenv>=1.0", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pandas>=2", "schwab-py>=1.5"]

[tool.setuptools]
packages = {find = {where = ["cc_sdk", "cc_server"], include = ["cc_sdk*", "cc_server*"]}}

[tool.pytest.ini_options]
testpaths = ["cc_sdk/tests", "cc_server/tests", "bots/spy_mr_bot/tests"]
pythonpath = ["cc_sdk", "cc_server", "bots/spy_mr_bot"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E","F","I","B","UP"]
ignore = ["B018","UP017","E501","E702"]
